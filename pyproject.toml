[project]
name = "personal-site"
version = "0.1.0"
description = "Personal one-page website of a programmer (static HTML, CSS and JavaScript)"
requires-python = ">=3.12"
# The site is static: no runtime dependencies. Tests run on pytest only (requirements-dev.lock).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
