# Release of an agent repository's app (asome-platform templates/agent-repo; ARCHITEKTURA kap. 12.5).
# On main only, never for a PR. The image stays PRIVATE on GHCR (it is the agents' code); asome
# pulls it with a read-only token, verifies the signature and serves exactly that digest to the
# staging VM (asome-apps, registry-vm). Signing, per repository (variable ASOME_SIGNING, set by
# asome-platform's `make f5-github` from policies/dev.yaml `release_signing`):
#   key (default)  cosign with this repository's key, a secret of the environment `release` that
#                  only jobs from main receive (deployment branch policy); an empty signing config:
#                  no Fulcio certificate, no Rekor entry, nothing about the repository is public.
#                  asome checks the key and the signed annotations repo/workflow/ref.
#   keyless        (opt-in) Fulcio certificate of this workflow on main; repository name, workflow
#                  and commit go to the PUBLIC Rekor log. asome checks identity and workflow claims.
#   build            read-only: build the image into an OCI archive and scan it with Trivy
#   publish          packages:write, the key from the environment, no third-party code except
#                    cosign-installer: push exactly the scanned archive and sign its digest
#   publish-keyless  the same with id-token:write instead of the key (only when chosen)
name: release
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      image: ${{ steps.check.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Is there an app image to release
        id: check
        run: |
          if [ -f Dockerfile ]; then echo "image=true" >> "$GITHUB_OUTPUT"; else echo "no Dockerfile: nothing to release"; fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.check.outputs.image == 'true'
      - name: Build into an OCI archive (nothing is pushed here)
        if: steps.check.outputs.image == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          provenance: false
          sbom: false
          outputs: type=oci,dest=${{ runner.temp }}/out/image.tar
      # Upload first: the artifact is immutable, so the scanner cannot change what is published.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check.outputs.image == 'true'
        with:
          name: image
          path: ${{ runner.temp }}/out/
          retention-days: 1
          if-no-files-found: error
      # Trivy reads an OCI layout directory or a docker archive, not an OCI tar (F5 live: "manifest.json
      # not found in tar"); unpacked like asome-platform's images.yml
      - name: Unpack the archive for the scanner
        if: steps.check.outputs.image == 'true'
        run: |
          mkdir "$RUNNER_TEMP/oci"
          tar -xf "$RUNNER_TEMP/out/image.tar" -C "$RUNNER_TEMP/oci"
          test -f "$RUNNER_TEMP/oci/index.json"
      - name: Scan (fail on fixable critical/high)
        if: steps.check.outputs.image == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/oci
          version: v0.76.1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"

  publish:
    needs: build
    if: needs.build.outputs.image == 'true' && vars.ASOME_SIGNING != 'keyless'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release   # its secret RELEASE_SIGNING_KEY exists only for jobs from main
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}/in
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.4"   # same as the verifier on asome (asome-platform policies/host-images.yaml)
      - name: Push the scanned archive and sign its digest with the repository's key (no public log)
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "RELEASE_SIGNING_KEY missing in environment release: make f5-release-key REPO=<name> (asome-platform)"; exit 1; }
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io --username "$ACTOR" --password-stdin
          skopeo copy --all --digestfile "$RUNNER_TEMP/digest" "oci-archive:$RUNNER_TEMP/in/image.tar" "docker://$image:sha-$GITHUB_SHA"
          digest=$(cat "$RUNNER_TEMP/digest")
          # cosign takes only its own encrypted key format: import the PEM from stdin under a
          # one-time password; an empty signing config means no Fulcio, no Rekor, no timestamp server
          keys="$RUNNER_TEMP/release-key"
          mkdir -m 700 "$keys"
          COSIGN_PASSWORD="$(openssl rand -hex 32)"
          export COSIGN_PASSWORD
          printf '%s\n' "$RELEASE_SIGNING_KEY" | cosign import-key-pair --yes --key /dev/stdin --output-key-prefix "$keys/cosign" >/dev/null
          cosign signing-config create --out "$keys/no-tlog.json"
          cosign sign --yes --key "$keys/cosign.key" --signing-config "$keys/no-tlog.json" \
            -a "asome.repo=$GITHUB_REPOSITORY" -a "asome.workflow=release.yml" -a "asome.ref=$GITHUB_REF" \
            -a "asome.sha=$GITHUB_SHA" "$image@$digest"
          rm -rf "$keys"
          skopeo copy --all "docker://$image@$digest" "docker://$image:main"
          echo "$image@$digest" >> "$GITHUB_STEP_SUMMARY"

  publish-keyless:
    needs: build
    if: needs.build.outputs.image == 'true' && vars.ASOME_SIGNING == 'keyless'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}/in
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.4"   # same as the verifier on asome (asome-platform policies/host-images.yaml)
      - name: Push the scanned archive and sign its digest (keyless; the PUBLIC Rekor log records it)
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io --username "$ACTOR" --password-stdin
          skopeo copy --all --digestfile "$RUNNER_TEMP/digest" "oci-archive:$RUNNER_TEMP/in/image.tar" "docker://$image:sha-$GITHUB_SHA"
          digest=$(cat "$RUNNER_TEMP/digest")
          cosign sign --yes "$image@$digest"
          skopeo copy --all "docker://$image@$digest" "docker://$image:main"
          echo "$image@$digest" >> "$GITHUB_STEP_SUMMARY"
